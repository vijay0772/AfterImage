# Render Blueprint - Deploy backend to Render (Docker = Python 3.11, avoids 3.14 build failures)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: afterimage-api
    runtime: docker
    region: oregon
    rootDir: Backend
    dockerfilePath: ./Dockerfile

    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: BACKEND_ORIGIN
        sync: false
